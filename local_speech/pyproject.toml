[project]
name = "ha-ai-tools-speech"
version = "0.1.0"
description = "AI Tools 的可选 Mac 本地语音服务"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "httpx>=0.28,<1", "numpy>=2,<3", "soundfile>=0.13,<1"]

[project.optional-dependencies]
inference = ["mlx-audio[stt,tts]==0.5.9; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "asgi-lifespan>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
